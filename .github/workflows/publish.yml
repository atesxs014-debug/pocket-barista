# Var olan bir derlemenin dosyalarını "latest" Release'e yükler (yeniden derlemeden).
name: Publish

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build çalıştırma numarası (run id)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PocketBarista-Android-APK
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: PocketBarista-iOS-IPA-unsigned
          path: dist
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: |
          find dist -name "*.apk" -exec mv {} dist/PocketBarista.apk \;
          find dist -name "*.ipa" -exec mv {} dist/PocketBarista.ipa \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Pocket Barista (son sürüm)
          body: "Android: PocketBarista.apk, iPhone (imzasız): PocketBarista.ipa"
          make_latest: true
          files: |
            dist/PocketBarista.apk
            dist/PocketBarista.ipa

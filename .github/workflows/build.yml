# Pocket Barista: her push'ta Android APK ve iOS IPA (imzasız) üretir.
# Gerekli gizli anahtarlar (Settings > Secrets and variables > Actions):
#   UNITY_EMAIL, UNITY_PASSWORD, UNITY_LICENSE (Unity_lic.ulf dosyasının tam içeriği)
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Disk alanı aç
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          large-packages: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Unity derleme (kurulum + APK)
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: Android
          unityVersion: 6000.4.8f1
          buildMethod: PocketBaristaCI.Build
          buildName: PocketBarista
          androidExportType: androidPackage

      - uses: actions/upload-artifact@v4
        with:
          name: PocketBarista-Android-APK
          path: build/Android
          retention-days: 14

  ios-xcode:
    name: iOS Xcode projesi
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Disk alanı aç
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          large-packages: false

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - name: Unity derleme (kurulum + Xcode)
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: iOS
          unityVersion: 6000.4.8f1
          buildMethod: PocketBaristaCI.Build
          buildName: PocketBarista

      - uses: actions/upload-artifact@v4
        with:
          name: PocketBarista-iOS-Xcode
          path: build/iOS
          retention-days: 3

  ios-ipa:
    name: iOS IPA (imzasız)
    needs: ios-xcode
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PocketBarista-iOS-Xcode
          path: xcode

      - name: Xcode ile derle (imzasız)
        run: |
          PROJ=$(find xcode -name "Unity-iPhone.xcodeproj" -maxdepth 3 | head -n 1)
          echo "Proje: $PROJ"
          xcodebuild -project "$PROJ" -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/PocketBarista.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 50

      - name: IPA paketle
        run: |
          mkdir -p Payload out
          cp -R "$RUNNER_TEMP/PocketBarista.xcarchive/Products/Applications/"*.app Payload/
          zip -qry out/PocketBarista-unsigned.ipa Payload
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: PocketBarista-iOS-IPA-unsigned
          path: out/PocketBarista-unsigned.ipa
          retention-days: 14
